name: Daily Sale Scan

on:
  schedule:
    # 10:00 UTC ≈ 6am ET, every day — digest in the inbox with morning coffee,
    # in time to plan same-day sale runs.
    - cron: "0 10 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: daily-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    # SMTP credentials live in this deployment environment's secrets.
    environment: MAIN
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Classifier regression tests
        run: python tests/test_classify.py

      - name: Run scan
        # Each falls back to a repository *variable* of the same name in case
        # the value was added under the Variables tab instead of Secrets.
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST || vars.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || vars.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME || vars.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD || vars.SMTP_PASSWORD }}
          DIGEST_FROM: ${{ secrets.DIGEST_FROM || vars.DIGEST_FROM }}
          DIGEST_TO: ${{ secrets.DIGEST_TO || vars.DIGEST_TO }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY || vars.BRAVE_API_KEY }}
        run: python -m scanner.main

      - name: Upload digest artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: digest
          path: digest.html
          if-no-files-found: ignore

      - name: Commit seen-sales state and board
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/seen_sales.json docs/index.html
          if ! git diff --cached --quiet; then
            git commit -m "chore: update seen sales and board [skip ci]"
            # The branch may have moved while the scan ran; rebase (keeping
            # our fresh state file on conflict) and retry.
            for i in 1 2 3; do
              git push && break
              git pull --rebase -X theirs origin "${GITHUB_REF_NAME}"
            done
          fi
